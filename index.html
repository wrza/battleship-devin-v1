<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>Battleship | Fleet Command</title>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script>window.__battleshipConsoleWarn=console.warn;console.warn=()=>{};</script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
:root{color-scheme:dark;--ink:#edf6ff;--muted:#9bb2c8;--panel:rgba(10,31,54,.9);--line:rgba(126,185,225,.25);--water:#12466c;--dark:#0c3453;--accent:#62d7ff;--hit:#ec6464}
*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:radial-gradient(circle at 15% 5%,rgba(44,128,173,.22),transparent 35%),linear-gradient(145deg,#061525,#0b263d 55%,#081827);min-height:100vh}button{font:inherit}.app{width:min(1180px,100%);margin:auto;padding:28px 20px 42px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;font-weight:800}h1{margin:4px 0 0;font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.045em;line-height:1}.tagline{color:var(--muted);max-width:350px;margin:0;text-align:right}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.24)}.instructions{padding:18px 22px;margin-bottom:20px;color:#c9e3f2;line-height:1.5}.instructions strong{color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}.boards{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:20px}.board-panel{padding:18px}.board-heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}h2{margin:0;font-size:1.1rem;letter-spacing:.03em}.board-heading span{color:var(--muted);font-size:.8rem}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:5px;background:rgba(0,0,0,.22);border-radius:10px}.cell{position:relative;aspect-ratio:1;min-width:0;border:1px solid rgba(163,218,246,.14);border-radius:3px;color:transparent;background:var(--dark);padding:0;cursor:default;transition:background .15s,transform .15s}.cell.clickable{cursor:crosshair}.cell.clickable:hover{background:#1a608b;transform:scale(1.06);z-index:1;border-color:var(--accent)}.cell.ship{background:#647d99;border-color:#8aa1b8}.cell.preview{background:rgba(98,215,255,.72);border-color:var(--accent)}.cell.preview.invalid{background:rgba(236,100,100,.75);border-color:#ff9b9b}.cell.hit{background:var(--hit);border-color:#ff9b9b}.cell.miss{background:#1a688e;border-color:#8dd5ea}.marker{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(.65rem,2.1vw,1.15rem);font-weight:900;line-height:1}.hit .marker{color:#fff}.miss .marker{color:#d8f2ff;font-size:clamp(.55rem,1.8vw,.9rem)}.ship.hit .marker{color:#fff}.labels{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:0 5px;color:var(--muted);font-size:.62rem;text-align:center;margin-top:5px}.side{padding:20px}.side h2{margin-bottom:14px}.status{padding:13px 14px;border-left:3px solid var(--accent);background:rgba(98,215,255,.08);color:#d5f2ff;line-height:1.4;min-height:48px;margin-bottom:18px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}.button{border:1px solid #1e91c1;border-radius:8px;padding:9px 12px;color:#e8f9ff;background:#125374;cursor:pointer;font-weight:700}.button:hover{background:#1b7196}.button.primary{color:#062136;background:var(--accent);border-color:var(--accent)}.button:disabled{opacity:.4;cursor:not-allowed}.ship-list{list-style:none;padding:0;margin:0 0 20px}.ship-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(126,185,225,.14);color:#bfd1df}.ship-list li.active{color:var(--accent);font-weight:800}.ship-list li.sunk{color:var(--hit);text-decoration:line-through}.ship-list small{color:var(--muted)}.log{border-top:1px solid var(--line);padding-top:14px}.log h3{margin:0 0 8px;font-size:.82rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}.log ul{list-style:none;padding:0;margin:0;max-height:210px;overflow:auto}.log li{padding:5px 0;color:#c3d8e7;font-size:.84rem;line-height:1.35}.error{color:#ffb2b2;background:rgba(196,60,60,.15);border:1px solid rgba(255,137,137,.4);border-radius:7px;padding:9px 11px;margin-bottom:13px;font-size:.87rem}.turn{color:var(--accent);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px}.result{text-align:center;padding:35px 20px;margin-bottom:20px;border:1px solid var(--accent)}.result h2{font-size:2rem;color:var(--accent);margin-bottom:8px}.result p{color:var(--muted);margin:0 0 20px}footer{color:#7891a8;text-align:center;margin-top:24px;font-size:.75rem}@media(max-width:880px){.layout{grid-template-columns:1fr}.side{order:-1}.log ul{max-height:130px}}@media(max-width:620px){.app{padding:20px 10px 30px}header{display:block}.tagline{text-align:left;margin-top:10px}.boards{grid-template-columns:1fr}.board-panel{padding:13px}}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const{useEffect,useState}=React;
const SHIPS=[{name:"Carrier",size:5},{name:"Battleship",size:4},{name:"Cruiser",size:3},{name:"Submarine",size:3},{name:"Destroyer",size:2}],DIRECTIONS={horizontal:[1,0],vertical:[0,1]};
const keyFor=(x,y)=>x+","+y,cellsFor=(x,y,d,size)=>{const[dx,dy]=DIRECTIONS[d];return Array.from({length:size},(_,i)=>keyFor(x+dx*i,y+dy*i))},inBounds=c=>c.every(v=>{const[x,y]=v.split(",").map(Number);return x>=0&&x<10&&y>=0&&y<10}),makeBoard=(ships=[])=>({ships,shots:[]}),makeShip=(d,cells)=>({...d,cells,hits:[]});
const canPlace=(board,cells)=>inBounds(cells)&&!board.ships.some(s=>s.cells.some(c=>cells.includes(c)));
const emptyGameState=()=>({phase:"placement",playerBoard:makeBoard(),computerBoard:makeBoard(),currentTurn:"player",placementIndex:0,direction:"horizontal",hoverCell:null,placementError:"",messages:["Place your Carrier to begin."],winner:null});
const change=(s,c)=>({...s,...c}),addMessage=(s,m)=>({...s,messages:[m,...s.messages].slice(0,12)});
const placeShip=(s,side,d,cells)=>{const b=s[side+"Board"];return canPlace(b,cells)?change(s,{[side+"Board"]:makeBoard([...b.ships,makeShip(d,cells)])}):s};
const randomPlacement=(s,side)=>{let b=makeBoard();SHIPS.forEach(d=>{let cells;do{const dir=Math.random()<.5?"horizontal":"vertical";cells=cellsFor(Math.floor(Math.random()*10),Math.floor(Math.random()*10),dir,d.size)}while(!canPlace(b,cells));b=makeBoard([...b.ships,makeShip(d,cells)])});return change(s,{[side+"Board"]:b})};
// Swappable AI hook: this is the only function that chooses a target.
function chooseComputerShot(gameState){const fired=new Set(gameState.computerBoard.shots),available=[];for(let y=0;y<10;y++)for(let x=0;x<10;x++){const c=keyFor(x,y);if(!fired.has(c))available.push(c)}return available[Math.floor(Math.random()*available.length)]}
const markShot=(board,cell)=>{const shots=board.shots.includes(cell)?board.shots:[...board.shots,cell],ships=board.ships.map(s=>s.cells.includes(cell)&&!s.hits.includes(cell)?{...s,hits:[...s.hits,cell]}:s),hitShip=board.ships.find(s=>s.cells.includes(cell)),hitShipAfter=hitShip&&ships.find(s=>s.name===hitShip.name),sunkShip=hitShipAfter&&hitShipAfter.cells.every(c=>hitShipAfter.hits.includes(c));return{board:{...board,shots,ships},hit:!!hitShip,sunkShip:sunkShip?hitShip.name:null}};
const allSunk=b=>b.ships.length===SHIPS.length&&b.ships.every(s=>s.hits.length===s.size);
const fireAt=(s,attacker,cell)=>{const targetSide=attacker==="player"?"computer":"player",target=s[targetSide+"Board"];if(target.shots.includes(cell))return s;const r=markShot(target,cell);let n=change(s,{[targetSide+"Board"]:r.board});n=addMessage(n,r.hit?(r.sunkShip?`${attacker==="player"?"You sank the enemy ":"The enemy sank your "}${r.sunkShip}!`:`${attacker==="player"?"Direct hit on the enemy":"The enemy hit your"} fleet!`):`${attacker==="player"?"Your shot":"The enemy shot"} missed.`);return allSunk(r.board)?change(n,{phase:"gameover",winner:attacker,currentTurn:null}):n};
const reducer=(s,a)=>{switch(a.type){case"ROTATE":return change(s,{direction:s.direction==="horizontal"?"vertical":"horizontal",placementError:""});case"HOVER":return change(s,{hoverCell:a.cell});case"PLACE":{if(s.phase!=="placement"||s.placementIndex>=SHIPS.length)return s;const[x,y]=a.cell.split(",").map(Number),d=SHIPS[s.placementIndex],cells=cellsFor(x,y,s.direction,d.size);if(!canPlace(s.playerBoard,cells))return change(s,{placementError:`The ${d.name} cannot be placed there. Move it fully on the board without overlapping another ship.`});const n=placeShip(s,"player",d,cells),i=s.placementIndex+1;return change(n,{placementIndex:i,placementError:"",messages:[`${d.name} placed.`,...s.messages].slice(0,12)})}case"RANDOM":{const n=randomPlacement(change(s,{placementIndex:0,placementError:""}),"player");return change(n,{placementIndex:SHIPS.length,messages:["Random fleet placement ready.",...s.messages].slice(0,12)})}case"RESET":return emptyGameState();case"START":{if(s.playerBoard.ships.length!==SHIPS.length)return change(s,{placementError:"Place all five ships before starting the battle."});return change(randomPlacement(s,"computer"),{phase:"playing",currentTurn:"player",placementError:"",messages:["Battle stations! Your turn to fire."]})}case"PLAYER_FIRE":return s.phase!=="playing"||s.currentTurn!=="player"||s.computerBoard.shots.includes(a.cell)?s:fireAt(change(s,{currentTurn:"computer"}),"player",a.cell);case"COMPUTER_FIRE":{if(s.phase!=="playing"||s.currentTurn!=="computer")return s;const n=fireAt(s,"computer",a.cell);return n.phase==="gameover"?n:change(n,{currentTurn:"player"})}default:return s}};
const isHit=(b,c)=>b.ships.some(s=>s.hits.includes(c)),shipAt=(b,c)=>b.ships.find(s=>s.cells.includes(c));
function Board({board,enemy,state,dispatch}){const preview=state.phase==="placement"&&state.placementIndex<SHIPS.length&&state.hoverCell?(()=>{const[x,y]=state.hoverCell.split(",").map(Number),cells=cellsFor(x,y,state.direction,SHIPS[state.placementIndex].size);return{cells,valid:canPlace(state.playerBoard,cells)}})():null;return <><div className="grid" onMouseLeave={()=>dispatch({type:"HOVER",cell:null})}>{Array.from({length:100},(_,i)=>{const x=i%10,y=Math.floor(i/10),cell=keyFor(x,y),hit=isHit(board,cell),fired=board.shots.includes(cell),ship=shipAt(board,cell),pv=!enemy&&preview&&preview.cells.includes(cell),classes=["cell",ship&&!enemy?"ship":"",hit?"hit":"",fired&&!hit?"miss":"",pv?"preview":"",pv&&!preview.valid?"invalid":"",enemy&&state.phase==="playing"&&state.currentTurn==="player"&&!fired?"clickable":""].filter(Boolean).join(" ");return <button key={cell} className={classes} aria-label={`${enemy?"Enemy":"Your"} cell ${x+1},${y+1}`} onMouseEnter={()=>!enemy&&dispatch({type:"HOVER",cell})} onClick={()=>dispatch({type:enemy?"PLAYER_FIRE":"PLACE",cell})}>{hit?<span className="marker">✕</span>:fired?<span className="marker">•</span>:null}</button>})}</div><div className="labels">{["A","B","C","D","E","F","G","H","I","J"].map(x=><span key={x}>{x}</span>)}</div></>};
function ShipList({board,state}){return <ul className="ship-list">{SHIPS.map((d,i)=>{const s=board.ships.find(x=>x.name===d.name),sunk=s&&s.hits.length===s.size;return <li key={d.name} className={`${sunk?"sunk ":""}${state.phase==="placement"&&i===state.placementIndex?"active":""}`}><span>{d.name}</span><small>{sunk?"SUNK":s?`${s.hits.length}/${d.size} hits`:`${d.size} cells`}</small></li>})}</ul>}
function App(){const[gameState,setGameState]=useState(emptyGameState),dispatch=a=>setGameState(s=>reducer(s,a));useEffect(()=>{if(gameState.phase==="playing"&&gameState.currentTurn==="computer"){const t=setTimeout(()=>dispatch({type:"COMPUTER_FIRE",cell:chooseComputerShot(gameState)}),600);return()=>clearTimeout(t)}},[gameState.phase,gameState.currentTurn,gameState.computerBoard.shots.length]);useEffect(()=>{const f=e=>{if(e.key.toLowerCase()==="r"&&gameState.phase==="placement")dispatch({type:"ROTATE"})};addEventListener("keydown",f);return()=>removeEventListener("keydown",f)},[gameState.phase]);const instruction=gameState.phase==="placement"?(gameState.placementIndex<SHIPS.length?`Place your ${SHIPS[gameState.placementIndex].name} (${SHIPS[gameState.placementIndex].size} cells).`:"All ships placed. Start the game when ready."):gameState.phase==="playing"?(gameState.currentTurn==="player"?"Select a cell in Enemy Waters to fire.":"Enemy is choosing a target…"):"The battle is complete.";return <div className="app"><header><div><div className="eyebrow">Fleet command / single player</div><h1>BATTLESHIP</h1></div><p className="tagline">Read the waves. Place with purpose. Sink the enemy fleet.</p></header><div className="instructions panel"><strong>{instruction}</strong> {gameState.phase==="placement"&&"Rotate with R or the button, then click a starting cell."}</div>{gameState.phase==="gameover"&&<section className="result panel"><h2>{gameState.winner==="player"?"Victory!":"Fleet Lost"}</h2><p>{gameState.winner==="player"?"You sank the entire enemy fleet.":"The enemy sank your entire fleet."}</p><button className="button primary" onClick={()=>dispatch({type:"RESET"})}>New Game</button></section>}<div className="layout"><main className="boards"><section className="board-panel panel"><div className="board-heading"><h2>Your Fleet</h2><span>{gameState.playerBoard.ships.length}/5 placed</span></div><Board board={gameState.playerBoard} enemy={false} state={gameState} dispatch={dispatch}/></section><section className="board-panel panel"><div className="board-heading"><h2>Enemy Waters</h2><span>{gameState.computerBoard.shots.length}/100 fired</span></div><Board board={gameState.computerBoard} enemy state={gameState} dispatch={dispatch}/></section></main><aside className="side panel"><div className="turn">{gameState.phase==="placement"?"Placement phase":gameState.phase==="gameover"?"Final report":`${gameState.currentTurn==="player"?"Your":"Enemy"} turn`}</div><div className="status">{gameState.phase==="placement"?"Build your defensive line before battle begins.":gameState.phase==="playing"?(gameState.currentTurn==="player"?"Weapons online. Choose your next coordinate.":"Incoming fire detected. Hold position."):"Review the battle report and deploy a new fleet."}</div>{gameState.placementError&&<div className="error" role="alert">{gameState.placementError}</div>}{gameState.phase==="placement"&&<div className="actions"><button className="button" onClick={()=>dispatch({type:"ROTATE"})}>Rotate: {gameState.direction}</button><button className="button" onClick={()=>dispatch({type:"RANDOM"})}>Random placement</button><button className="button" onClick={()=>dispatch({type:"RESET"})}>Reset placement</button><button className="button primary" disabled={gameState.playerBoard.ships.length!==SHIPS.length} onClick={()=>dispatch({type:"START"})}>Start game</button></div>}<h2>Fleet status</h2><ShipList board={gameState.playerBoard} state={gameState}/><div className="log"><h3>Message log</h3><ul>{gameState.messages.map((m,i)=><li key={`${m}-${i}`}>{m}</li>)}</ul></div></aside></div><footer>Hits are marked ✕ · Misses are marked • · Computer targeting is random</footer></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
